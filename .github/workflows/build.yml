name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Lets you trigger a build on demand from the Actions tab, with no push
  # needed -- this is the "just give me an APK to test" button.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # NOTE: this is the fix for the "Gradle can't run on JDK 25" issue
          # we hit in Codespaces -- a GitHub-hosted runner starts clean and
          # setup-java pins the JDK explicitly, so that class of problem
          # can't happen here regardless of what the runner ships by default.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default `packages` input is "tools platform-tools" -- the
          # standalone "tools" package was removed from Google's SDK
          # repository years ago and no longer exists, so the default always
          # fails with "Failed to find package 'tools'" on a fresh runner.
          # GitHub-hosted runners already ship a preinstalled Android SDK
          # (incl. platform-tools) at $ANDROID_HOME, so we don't need this
          # action to install anything -- just accept licenses / set env.
          packages: ''

      - name: Install required SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK info
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "Built: $APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DailyDivine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
