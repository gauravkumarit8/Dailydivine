name: Deploy website (GitHub Pages)

# Publishes /docs (landing page, privacy policy, terms) to https://<user>.github.io/<repo>/.
# One-time: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".

# NOTE: manual only. The live site is hosted on the developer's own domain (see play-store/LISTING.md),
# so an automatic deploy on every push would fail with a red X unless GitHub Pages is enabled.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
