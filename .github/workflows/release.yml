name: Release AAB (Google Play)

# Builds a SIGNED Android App Bundle (.aab), verifies it, and (optionally) uploads it to Google Play's
# internal testing track. Manual only: Actions > "Release AAB (Google Play)" > Run workflow.
# One-time setup (keystore + secrets): see play-store/RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code: a whole number that MUST be higher than every upload so far (1, 2, 3, ...)"
        required: true
      upload_to_play:
        description: "Also upload to Play internal testing (needs the PLAY_SERVICE_ACCOUNT_JSON secret; the app must already exist in Play Console)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version inputs
        run: |
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::version_code must be a whole number"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::version_name must look like 1.0.0"; exit 1; }
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"

      - name: Release readiness check (placeholders, permissions, targetSdk, assets)
        run: python3 tools/check_release_readiness.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # the default "tools" package no longer exists; the runner already has the SDK

      - name: Install required SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. An unsigned bundle cannot be uploaded to Google Play. See play-store/RELEASE.md, step 2."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle (R8 shrinking on)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" --stacktrace

      - name: Locate the bundle
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          [ -n "$AAB" ] || { echo "::error::No .aab was produced"; exit 1; }
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          ls -lh "$AAB"

      - name: Verify the bundle is signed
        run: |
          OUT=$(jarsigner -verify "$AAB" 2>&1 || true)
          echo "$OUT" | tail -n 5
          echo "$OUT" | grep -q "jar verified" || { echo "::error::The bundle is NOT correctly signed"; exit 1; }

      - name: Verify the merged manifest (privacy and policy guardrails)
        run: |
          MF=$(find app/build/intermediates -path "*merged_manifests/release*" -name AndroidManifest.xml | head -n1)
          [ -n "$MF" ] || { echo "::error::Merged release manifest not found"; exit 1; }
          cp "$MF" merged-manifest.xml
          echo "--- permissions in the merged manifest:"; grep -o 'uses-permission[^>]*android:name="[^"]*"' merged-manifest.xml | sed 's/.*android:name=//' | sort
          fail=0
          for bad in android.permission.INTERNET com.google.android.gms.permission.AD_ID com.android.vending.BILLING android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS android.permission.ACCESS_NETWORK_STATE; do
            if grep -q "android:name=\"$bad\"" merged-manifest.xml; then echo "::error::Forbidden permission present in the merged manifest: $bad (the privacy policy says the app has no internet access and no ads/billing)"; fail=1; fi
          done
          grep -q 'android:targetSdkVersion="36"' merged-manifest.xml || { echo "::error::targetSdkVersion is not 36 (Google Play requires 36)"; fail=1; }
          exit $fail

      - name: Validate the bundle with bundletool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --dir . --clobber
          BT=$(ls bundletool-all-*.jar | head -n1)
          java -jar "$BT" validate --bundle="$AAB"
          CODE=$(java -jar "$BT" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode)
          NAME=$(java -jar "$BT" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionName)
          echo "Bundle says versionCode=$CODE versionName=$NAME"
          [ "$CODE" = "$VERSION_CODE" ] || { echo "::error::versionCode in the bundle ($CODE) differs from the requested $VERSION_CODE"; exit 1; }
          [ "$NAME" = "$VERSION_NAME" ] || { echo "::error::versionName in the bundle ($NAME) differs from the requested $VERSION_NAME"; exit 1; }
          unzip -l "$AAB" | grep -q "proguard.map" && echo "R8 mapping file is embedded (Play Console will de-obfuscate crashes)" || echo "::warning::No R8 mapping embedded in the bundle"

      - name: Upload to Google Play internal testing (draft)
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dailydivine.app
          releaseFiles: ${{ env.AAB }}
          track: internal
          status: draft

      - name: Upload the signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: DailyDivine-release-aab
          path: |
            ${{ env.AAB }}
            app/build/outputs/mapping/release/mapping.txt
            merged-manifest.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lint-report
          path: app/build/reports/lint-results-release*
          if-no-files-found: ignore

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
